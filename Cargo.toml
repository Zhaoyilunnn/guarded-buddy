[package]
name = "buddy"
version = "0.1.0"
edition = "2024"
description = "A guarded buddy — agents on a leash for weekly reports"
license = "MIT"

[[bin]]
name = "buddy"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0.0"
libc = "0.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.3"
wait-timeout = "0.2.1"
walkdir = "2.5.0"

axum = "0.8.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal"] }
rand = "0.10.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
